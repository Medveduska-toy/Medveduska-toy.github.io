<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Original Art Toys — Medveduska</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .gallery-page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 45px 6% 100px;
    }

    .gallery-back {
      display: inline-block;
      margin-bottom: 55px;
      color: #222;
      text-decoration: none;
      font-family: "Courier Prime", monospace;
      font-size: 14px;
    }

    .gallery-title {
      text-align: center;
      margin-bottom: 60px;
    }

    .gallery-title h1 {
      font-family: "Libre Caslon Display", serif;
      font-weight: normal;
      font-size: clamp(42px, 6vw, 82px);
      margin: 0 0 15px;
    }

    .gallery-title p {
      font-family: "Courier Prime", monospace;
      font-size: 15px;
    }

    .art-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .art-gallery img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 800px) {
      .art-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .art-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="gallery-page">

    <a class="gallery-back" href="index.html">← BACK TO HOME</a>

    <header class="gallery-title">
      <h1>Original Art Toys</h1>
      <p>Handmade characters by Ivana Anic</p>
    </header>

    <div class="art-gallery">
      <!-- Aquí iremos añadiendo tus fotografías -->
    </div>

  </main>

</body>
</html>
