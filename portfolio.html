<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Medveduska</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .portfolio-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 45px 25px 100px;
    }

    .portfolio-back {
      display: inline-block;
      margin-bottom: 45px;
      color: inherit;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .portfolio-page h1 {
      font-family: Georgia, serif;
      font-size: clamp(42px, 7vw, 76px);
      font-weight: normal;
      margin-bottom: 12px;
    }

    .portfolio-intro {
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 45px;
    }

    
.portfolio-gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.portfolio-gallery img {
  width: 100%;
  height: auto;
  object-fit: contain;
  display: block;
  cursor: pointer;
}


    @media (max-width: 700px) {
      .portfolio-gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

    }

    @media (max-width: 420px) {
      .portfolio-gallery {
        grid-template-columns: 1fr;
      }

      .portfolio-gallery img {
        height: auto;
      }
    }
  </style>
</head>

<body>
  <main class="portfolio-page">
    <a class="portfolio-back" href="index.html">← BACK TO HOME</a>

    <h1>Portfolio</h1>

    <p class="portfolio-intro">
      A collection of handmade characters,
      artist teddy bears and original art toys by Ivana Anic.
    </p>

    
<div class="portfolio-gallery">
  <img src="Conejito vintage con calabaza otoñal.png" alt="Vintage pumpkin bunny" loading="lazy">
  <img src="Conejito Vintage de Edición Limitada.png" alt="Limited edition vintage bunny" loading="lazy">
  <img src="Conejito vintage de invierno.png" alt="Winter vintage bunny" loading="lazy">
  <img src="Conejitos vintage de edición invernal.png" alt="Vintage winter bunnies" loading="lazy">
  <img src="Conejitos vintage de invierno Dahlia.png" alt="Dahlia winter bunnies" loading="lazy">
  <img src="Giraffe artista vintage con sombrero y bufanda.png" alt="Vintage artist giraffe" loading="lazy">
  <img src="Retrato vintage de oso de peluche artesanal.png" alt="Handmade vintage teddy bear" loading="lazy">
  <img src="Tres amigos de lino y encaje.png" alt="Three friends in linen and lace" loading="lazy">
</div>

  </main>

<style>
.portfolio-lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  z-index: 9999;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.portfolio-lightbox.open {
  display: flex;
}

.portfolio-lightbox img {
  max-width: 95%;
  max-height: 90vh;
  width: auto;
  height: auto;
  object-fit: contain;
}

.portfolio-lightbox-close {
  position: absolute;
  top: 15px;
  right: 25px;
  color: white;
  font-size: 36px;
  cursor: pointer;
  background: none;
  border: none;
}
</style>

<div class="portfolio-lightbox" id="portfolio-lightbox">
  <button class="portfolio-lightbox-close" id="portfolio-lightbox-close" aria-label="Close image">×</button>
  <img id="portfolio-lightbox-image" alt="Enlarged portfolio photograph">
</div>

<script>
const portfolioImages = document.querySelectorAll('.portfolio-gallery img');
const portfolioLightbox = document.getElementById('portfolio-lightbox');
const portfolioLightboxImage = document.getElementById('portfolio-lightbox-image');

portfolioImages.forEach(image => {
  image.addEventListener('click', () => {
    portfolioLightboxImage.src = image.src;
    portfolioLightboxImage.alt = image.alt;
    portfolioLightbox.classList.add('open');
  });
});

function closePortfolioLightbox() {
  portfolioLightbox.classList.remove('open');
}

document.getElementById('portfolio-lightbox-close')
  .addEventListener('click', closePortfolioLightbox);

portfolioLightbox.addEventListener('click', event => {
  if (event.target === portfolioLightbox) closePortfolioLightbox();
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closePortfolioLightbox();
});
</script>

</body>
</html>
