<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Medveduska</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .portfolio-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 45px 25px 100px;
    }

    .portfolio-back {
      display: inline-block;
      margin-bottom: 45px;
      color: inherit;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .portfolio-page h1 {
      font-family: Georgia, serif;
      font-size: clamp(42px, 7vw, 76px);
      font-weight: normal;
      margin-bottom: 12px;
    }

    .portfolio-intro {
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 45px;
    }

    .portfolio-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .portfolio-gallery img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .portfolio-gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .portfolio-gallery img {
        height: 220px;
      }
    }

    @media (max-width: 420px) {
      .portfolio-gallery {
        grid-template-columns: 1fr;
      }

      .portfolio-gallery img {
        height: auto;
      }
    }
  </style>
</head>

<body>
  <main class="portfolio-page">
    <a class="portfolio-back" href="index.html">← BACK TO HOME</a>

    <h1>Portfolio</h1>

    <p class="portfolio-intro">
      A collection of handmade characters,
      artist teddy bears and original art toys by Ivana Anic.
    </p>

    <div class="portfolio-gallery">
      <!-- Aquí añadiremos tus fotografías -->
    </div>
  </main>
</body>
</html>
